<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мессенджер</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <div class="sidebar">
        <div class="user-profile">
            <span id="my-username">Загрузка...</span>
            <button onclick="logout()" class="btn-logout">Выйти</button>
        </div>
        <div class="new-chat-box">
            <input type="text" id="target-user" placeholder="Имя собеседника">
            <button onclick="openChat()">Написать</button>
        </div>
        <div class="chat-list" id="chat-list"></div>
    </div>

    <div class="chat-area">
        <div class="chat-header" id="chat-header">Выберите чат</div>
        <div class="messages-list" id="messages-list">
            <div class="placeholder-text">Выберите контакт слева</div>
        </div>
        <div class="chat-input-area" id="input-area" style="display: none;">
            <input type="text" id="message-input" placeholder="Сообщение...">
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://agwwnngvrtemktkfedwx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_sS_4EgOUfQme_LDMK8WxAQ_v9_O_1L3';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const currentUser = localStorage.getItem('current_user');
    if (!currentUser) {
        window.location.href = 'index.html';
    } else {
        document.getElementById('my-username').innerText = 'Вы: ' + currentUser;
    }

    let activePartner = null;

    function getRoom(userA, userB) {
        return [userA, userB].sort().join('_');
    }

    function openChat() {
        const partner = document.getElementById('target-user').value.trim();
        if (!partner || partner === currentUser) {
            alert('Введите корректное имя собеседника');
            return;
        }
        activePartner = partner;
        document.getElementById('chat-header').innerText = `Чат с: ${partner}`;
        document.getElementById('input-area').style.display = 'flex';
        loadMessages();
    }

    async function loadMessages() {
        if (!activePartner) return;
        const roomId = getRoom(currentUser, activePartner);
        const { data, error } = await supabase
            .from('private_messages')
            .select('*')
            .eq('room_id', roomId)
            .order('created_at', { ascending: true });
        
        const list = document.getElementById('messages-list');
        list.innerHTML = '';
        
        if (data && data.length > 0) {
            data.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message-item ${msg.sender === currentUser ? 'outgoing' : 'incoming'}`;
                div.innerText = msg.text;
                list.appendChild(div);
            });
        } else {
            list.innerHTML = '<div class="placeholder-text">Нет сообщений. Напишите первое!</div>';
        }
        list.scrollTop = list.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('message-input');
        const text = input.value.trim();
        if (!text || !activePartner) return;

        const roomId = getRoom(currentUser, activePartner);
        const { error } = await supabase.from('private_messages').insert([{ 
            room_id: roomId, 
            sender: currentUser, 
            receiver: activePartner, 
            text 
        }]);

        if (!error) {
            input.value = '';
            loadMessages();
        } else {
            alert('Ошибка отправки сообщения');
        }
    }

    supabase.channel('realtime_chat')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'private_messages' }, payload => {
            if (activePartner && payload.new.room_id === getRoom(currentUser, activePartner)) {
                loadMessages();
            }
        })
        .subscribe();

    function logout() {
        localStorage.removeItem('current_user');
        window.location.href = 'index.html';
    }

    document.getElementById('message-input').addEventListener('keypress', (e) => { 
        if (e.key === 'Enter') sendMessage(); 
    });
</script>

</body>
</html>
