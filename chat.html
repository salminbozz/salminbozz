<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мессенджер</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #e2e8f0; display: flex; flex-direction: column; min-height: 100vh; padding: 12px; }

        .top-bar { background: #1e293b; padding: 12px 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; margin-bottom: 12px; }
        .user-info { font-weight: 600; color: #38bdf8; font-size: 0.95rem; }
        .btn-logout { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }

        .search-box { background: #1e293b; padding: 10px; border-radius: 12px; display: flex; gap: 8px; border: 1px solid #334155; margin-bottom: 12px; }
        input { background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; padding: 10px; outline: none; flex: 1; font-size: 0.9rem; }
        input:focus { border-color: #3b82f6; }
        button.btn-primary { background: #2563eb; color: white; border: none; border-radius: 8px; padding: 10px 14px; font-weight: 600; cursor: pointer; }

        .recent-chats { margin-bottom: 12px; }
        .section-title { font-size: 0.8rem; text-transform: uppercase; color: #94a3b8; margin-bottom: 6px; padding-left: 4px; font-weight: 700; }
        .chats-list { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
        .chat-chip { background: #1e293b; border: 1px solid #334155; padding: 8px 14px; border-radius: 20px; font-size: 0.9rem; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .chat-chip.active { background: #2563eb; border-color: #3b82f6; color: white; }

        .chat-container { background: #1e293b; border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column; height: 50vh; overflow: hidden; }
        .chat-header { background: #0f172a; padding: 12px 16px; font-weight: 600; border-bottom: 1px solid #334155; font-size: 0.95rem; }
        .messages-list { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .message-item { max-width: 80%; padding: 8px 12px; border-radius: 10px; font-size: 0.9rem; word-break: break-word; }
        .message-item.outgoing { align-self: flex-end; background: #2563eb; color: white; }
        .message-item.incoming { align-self: flex-start; background: #334155; color: #e2e8f0; }
        .placeholder { margin: auto; color: #64748b; font-size: 0.85rem; text-align: center; }

        .chat-input-bar { padding: 10px; background: #0f172a; border-top: 1px solid #334155; display: flex; gap: 8px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <span class="user-info" id="my-username">Вы: Загрузка...</span>
        <button onclick="logout()" class="btn-logout">Выйти</button>
    </div>

    <div class="search-box">
        <input type="text" id="target-user" placeholder="Имя собеседника...">
        <button onclick="startNewChat()" class="btn-primary">Написать</button>
    </div>

    <div class="recent-chats">
        <div class="section-title">Ваши диалоги:</div>
        <div class="chats-list" id="recent-chats-list">
            <div class="chat-chip">Загрузка...</div>
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-header" id="chat-header">Выберите собеседника выше</div>
        <div class="messages-list" id="messages-list">
            <div class="placeholder">Выберите диалог или введите имя собеседника</div>
        </div>
        <div class="chat-input-bar" id="input-area" style="display: none;">
            <input type="text" id="message-input" placeholder="Введите сообщение...">
            <button onclick="sendMessage()" class="btn-primary">Отправить</button>
        </div>
    </div>

<script>
    const SUPABASE_URL = 'https://agwwnngvrtemktkfedwx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_sS_4EgOUfQme_LDMK8WxAQ_v9_O_1L3';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const currentUser = localStorage.getItem('current_user');
    if (!currentUser) {
        window.location.href = 'index.html';
    } else {
        document.getElementById('my-username').innerText = 'Вы: ' + currentUser;
    }

    let activePartner = null;

    function getRoom(userA, userB) {
        return [userA, userB].sort().join('_');
    }

    async function loadRecentChats() {
        const { data, error } = await client
            .from('private_messages')
            .select('sender, receiver')
            .or(`sender.eq.${currentUser},receiver.eq.${currentUser}`);

        const listDiv = document.getElementById('recent-chats-list');
        listDiv.innerHTML = '';

        if (error || !data || data.length === 0) {
            listDiv.innerHTML = '<span style="font-size: 0.8rem; color: #64748b;">У вас пока нет чатов</span>';
            return;
        }

        const partners = new Set();
        data.forEach(msg => {
            if (msg.sender !== currentUser) partners.add(msg.sender);
            if (msg.receiver !== currentUser) partners.add(msg.receiver);
        });

        if (partners.size === 0) {
            listDiv.innerHTML = '<span style="font-size: 0.8rem; color: #64748b;">У вас пока нет чатов</span>';
            return;
        }

        partners.forEach(partner => {
            const chip = document.createElement('div');
            chip.className = `chat-chip ${partner === activePartner ? 'active' : ''}`;
            chip.innerText = partner;
            chip.onclick = () => selectPartner(partner);
            listDiv.appendChild(chip);
        });
    }

    function selectPartner(partner) {
        activePartner = partner;
        document.getElementById('chat-header').innerText = `Чат с: ${partner}`;
        document.getElementById('input-area').style.display = 'flex';
        loadRecentChats();
        loadMessages();
    }

    function startNewChat() {
        const partner = document.getElementById('target-user').value.trim();
        if (!partner || partner === currentUser) {
            alert('Введите имя другого пользователя!');
            return;
        }
        selectPartner(partner);
        document.getElementById('target-user').value = '';
    }

    async function loadMessages() {
        if (!activePartner) return;
        const roomId = getRoom(currentUser, activePartner);
        
        const { data, error } = await client
            .from('private_messages')
            .select('*')
            .eq('room_id', roomId)
            .order('id', { ascending: true });
        
        const list = document.getElementById('messages-list');
        list.innerHTML = '';
        
        if (data && data.length > 0) {
            data.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message-item ${msg.sender === currentUser ? 'outgoing' : 'incoming'}`;
                div.innerText = msg.text;
                list.appendChild(div);
            });
        } else {
            list.innerHTML = '<div class="placeholder">Нет сообщений. Напишите первое!</div>';
        }
        list.scrollTop = list.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('message-input');
        const text = input.value.trim();
        if (!text || !activePartner) return;

        const roomId = getRoom(currentUser, activePartner);
        const { error } = await client.from('private_messages').insert([{ 
            room_id: roomId, 
            sender: currentUser, 
            receiver: activePartner, 
            text 
        }]);

        if (!error) {
            input.value = '';
            loadMessages();
            loadRecentChats();
        } else {
            alert('Ошибка отправки: ' + error.message);
        }
    }

    loadRecentChats();

    client.channel('realtime_chat')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'private_messages' }, payload => {
            loadRecentChats();
            if (activePartner && payload.new.room_id === getRoom(currentUser, activePartner)) {
                loadMessages();
            }
        })
        .subscribe();

    function logout() {
        localStorage.removeItem('current_user');
        window.location.href = 'index.html';
    }

    document.getElementById('message-input').addEventListener('keypress', (e) => { 
        if (e.key === 'Enter') sendMessage(); 
    });
</script>
</body>
</html>
