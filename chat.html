<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мессенджер</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Добавим стили прямо в файл на случай, если style.css не подгружается */
        body { background-color: #0f172a; color: #e2e8f0; font-family: sans-serif; padding: 20px; }
        .debug-box { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; }
        input, button { padding: 10px; margin: 5px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
        button { background: #2563eb; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="debug-box">
    <h3 id="my-username">Загрузка профиля...</h3>
    <button onclick="logout()">Выйти из аккаунта</button>
</div>

<div class="debug-box">
    <input type="text" id="target-user" placeholder="Имя собеседника">
    <button onclick="openChat()">Открыть чат</button>
</div>

<div class="debug-box">
    <div id="chat-header" style="font-weight: bold; margin-bottom: 10px;">Выберите чат</div>
    <div id="messages-list" style="height: 150px; overflow-y: auto; background: #0b0f19; padding: 10px; margin-bottom: 10px;">
        Здесь будут сообщения...
    </div>
    <div id="input-area" style="display: flex; gap: 5px;">
        <input type="text" id="message-input" placeholder="Сообщение..." style="flex: 1;">
        <button onclick="sendMessage()">Отправить</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://agwwnngvrtemktkfedwx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_sS_4EgOUfQme_LDMK8WxAQ_v9_O_1L3';
    
    let client;
    try {
        client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch (e) {
        alert('Ошибка инициализации Supabase: ' + e.message);
    }

    const currentUser = localStorage.getItem('current_user');
    if (!currentUser) {
        window.location.href = 'index.html';
    } else {
        document.getElementById('my-username').innerText = 'Вы вошли как: ' + currentUser;
    }

    let activePartner = null;

    function getRoom(userA, userB) {
        return [userA, userB].sort().join('_');
    }

    function openChat() {
        const partner = document.getElementById('target-user').value.trim();
        if (!partner || partner === currentUser) {
            alert('Введите корректное имя собеседника');
            return;
        }
        activePartner = partner;
        document.getElementById('chat-header').innerText = `Чат с: ${partner}`;
        loadMessages();
    }

    async function loadMessages() {
        if (!activePartner) return;
        const roomId = getRoom(currentUser, activePartner);
        
        const { data, error } = await client
            .from('private_messages')
            .select('*')
            .eq('room_id', roomId)
            .order('created_at', { ascending: true });
        
        const list = document.getElementById('messages-list');
        list.innerHTML = '';
        
        if (error) {
            list.innerHTML = 'Ошибка загрузки: ' + error.message;
            return;
        }

        if (data && data.length > 0) {
            data.forEach(msg => {
                const div = document.createElement('div');
                div.style.margin = '5px 0';
                div.style.color = msg.sender === currentUser ? '#60a5fa' : '#34d399';
                div.innerText = `${msg.sender}: ${msg.text}`;
                list.appendChild(div);
            });
        } else {
            list.innerHTML = 'Нет сообщений в этом чате.';
        }
        list.scrollTop = list.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('message-input');
        const text = input.value.trim();
        if (!text || !activePartner) {
            alert('Сначала выберите чат и введите текст!');
            return;
        }

        const roomId = getRoom(currentUser, activePartner);
        const { error } = await client.from('private_messages').insert([{ 
            room_id: roomId, 
            sender: currentUser, 
            receiver: activePartner, 
            text 
        }]);

        if (!error) {
            input.value = '';
            loadMessages();
        } else {
            alert('Ошибка отправки: ' + error.message);
        }
    }

    function logout() {
        localStorage.removeItem('current_user');
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
