<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мессенджер</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #e2e8f0; display: flex; flex-direction: column; min-height: 100vh; padding: 12px; gap: 12px; }

        .top-bar { background: #1e293b; padding: 12px 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
        .user-info { font-weight: 600; color: #38bdf8; font-size: 0.95rem; }
        .btn-logout { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }

        .search-box { background: #1e293b; padding: 10px; border-radius: 12px; display: flex; gap: 8px; border: 1px solid #334155; }
        input { background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; padding: 10px; outline: none; flex: 1; font-size: 0.9rem; }
        input:focus { border-color: #3b82f6; }
        button.btn-primary { background: #2563eb; color: white; border: none; border-radius: 8px; padding: 10px 14px; font-weight: 600; cursor: pointer; }

        /* Блок всех пользователей (как на скриншоте) */
        .all-users-card { background: #1e293b; border-radius: 12px; border: 1px solid #334155; padding: 12px; max-height: 140px; overflow-y: auto; }
        .section-title { font-size: 0.8rem; text-transform: uppercase; color: #94a3b8; margin-bottom: 8px; font-weight: 700; display: flex; justify-content: space-between; }
        .users-cloud { display: flex; flex-wrap: wrap; gap: 6px; }
        .user-tag { background: #0f172a; border: 1px solid #334155; padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; color: #60a5fa; transition: 0.2s; }
        .user-tag:hover { background: #2563eb; color: white; border-color: #3b82f6; }
        .user-tag.active { background: #2563eb; color: white; }

        /* Область открытого чата */
        .chat-container { background: #1e293b; border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column; flex: 1; min-height: 300px; overflow: hidden; }
        .chat-header { background: #0f172a; padding: 12px 16px; font-weight: 600; border-bottom: 1px solid #334155; font-size: 0.95rem; }
        .messages-list { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .message-item { max-width: 80%; padding: 8px 12px; border-radius: 10px; font-size: 0.9rem; word-break: break-word; }
        .message-item.outgoing { align-self: flex-end; background: #2563eb; color: white; }
        .message-item.incoming { align-self: flex-start; background: #334155; color: #e2e8f0; }
        .placeholder { margin: auto; color: #64748b; font-size: 0.85rem; text-align: center; }

        .chat-input-bar { padding: 10px; background: #0f172a; border-top: 1px solid #334155; display: flex; gap: 8px; }
    </style>
</head>
<body>

    <!-- Шапка профиля -->
    <div class="top-bar">
        <span class="user-info" id="my-username">Вы: Загрузка...</span>
        <button onclick="logout()" class="btn-logout">Выйти</button>
    </div>

    <!-- Поиск / ввод конкретного пользователя -->
    <div class="search-box">
        <input type="text" id="target-user" placeholder="Введите имя пользователя...">
        <button onclick="validateAndOpenChat()" class="btn-primary">Написать</button>
    </div>

    <!-- Блок со списком ВСЕХ зарегистрированных пользователей -->
    <div class="all-users-card">
        <div class="section-title">
            <span>Зарегистрированные пользователи</span>
            <span id="users-count" style="color: #38bdf8;">0</span>
        </div>
        <div class="users-cloud" id="all-users-list">
            <span style="font-size: 0.8rem; color: #64748b;">Загрузка списка...</span>
        </div>
    </div>

    <!-- Окно чата -->
    <div class="chat-container">
        <div class="chat-header" id="chat-header">Выберите пользователя из списка выше</div>
        <div class="messages-list" id="messages-list">
            <div class="placeholder">Выберите собеседника, чтобы начать диалог</div>
        </div>
        <div class="chat-input-bar" id="input-area" style="display: none;">
            <input type="text" id="message-input" placeholder="Введите сообщение...">
            <button onclick="sendMessage()" class="btn-primary">Отправить</button>
        </div>
    </div>

<script>
    const SUPABASE_URL = 'https://agwwnngvrtemktkfedwx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_sS_4EgOUfQme_LDMK8WxAQ_v9_O_1L3';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const currentUser = localStorage.getItem('current_user');
    if (!currentUser) {
        window.location.href = 'index.html';
    } else {
        document.getElementById('my-username').innerText = 'Вы: ' + currentUser;
    }

    let activePartner = null;

    function getRoom(userA, userB) {
        return [userA, userB].sort().join('_');
    }

    // Загрузка ВСЕХ зарегистрированных пользователей из базы
    async function loadAllUsers() {
        const { data, error } = await client
            .from('users')
            .select('username')
            .neq('username', currentUser); // Исключаем себя из списка

        const listDiv = document.getElementById('all-users-list');
        const countSpan = document.getElementById('users-count');
        listDiv.innerHTML = '';

        if (error || !data || data.length === 0) {
            listDiv.innerHTML = '<span style="font-size: 0.8rem; color: #64748b;">Нет других пользователей</span>';
            countSpan.innerText = '0';
            return;
        }

        countSpan.innerText = data.length;

        data.forEach(user => {
            const tag = document.createElement('div');
            tag.className = `user-tag ${user.username === activePartner ? 'active' : ''}`;
            tag.innerText = user.username;
            tag.onclick = () => selectPartner(user.username);
            listDiv.appendChild(tag);
        });
    }

    // Проверка существования пользователя в базе перед открытием чата
    async function validateAndOpenChat() {
        const partner = document.getElementById('target-user').value.trim();
        
        if (!partner) {
            alert('Введите имя пользователя!');
            return;
        }
        if (partner === currentUser) {
            alert('Нельзя писать самому себе!');
            return;
        }

        // Проверяем, есть ли такой пользователь в таблице users
        const { data, error } = await client
            .from('users')
            .select('username')
            .eq('username', partner)
            .maybeSingle();

        if (error || !data) {
            alert('Такого пользователя не существует! Проверьте правильность написания.');
            return;
        }

        selectPartner(partner);
        document.getElementById('target-user').value = '';
    }

    function selectPartner(partner) {
        activePartner = partner;
        document.getElementById('chat-header').innerText = `Чат с: ${partner}`;
        document.getElementById('input-area').style.display = 'flex';
        loadAllUsers(); // обновить подсветку активного
        loadMessages();
    }

    async function loadMessages() {
        if (!activePartner) return;
        const roomId = getRoom(currentUser, activePartner);
        
        const { data, error } = await client
            .from('private_messages')
            .select('*')
            .eq('room_id', roomId)
            .order('id', { ascending: true });
        
        const list = document.getElementById('messages-list');
        list.innerHTML = '';
        
        if (data && data.length > 0) {
            data.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message-item ${msg.sender === currentUser ? 'outgoing' : 'incoming'}`;
                div.innerText = msg.text;
                list.appendChild(div);
            });
        } else {
            list.innerHTML = '<div class="placeholder">Нет сообщений. Напишите первое!</div>';
        }
        list.scrollTop = list.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('message-input');
        const text = input.value.trim();
        if (!text || !activePartner) return;

        const roomId = getRoom(currentUser, activePartner);
        const { error } = await client.from('private_messages').insert([{ 
            room_id: roomId, 
            sender: currentUser, 
            receiver: activePartner, 
            text 
        }]);

        if (!error) {
            input.value = '';
            loadMessages();
        } else {
            alert('Ошибка отправки: ' + error.message);
        }
    }

    // Загружаем список при старте
    loadAllUsers();

    // Реальное время для новых сообщений
    client.channel('realtime_chat')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'private_messages' }, payload => {
            if (activePartner && payload.new.room_id === getRoom(currentUser, activePartner)) {
                loadMessages();
            }
        })
        .subscribe();

    function logout() {
        localStorage.removeItem('current_user');
        window.location.href = 'index.html';
    }

    document.getElementById('message-input').addEventListener('keypress', (e) => { 
        if (e.key === 'Enter') sendMessage(); 
    });
</script>
</body>
</html>
