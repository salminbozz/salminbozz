<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход / Регистрация</title>
    <!-- Подключаем Supabase и общие стили -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-card">
    <h2>Вход в мессенджер</h2>
    <div class="form-group">
        <input type="text" id="username" placeholder="Придумайте или введите логин">
        <input type="password" id="password" placeholder="Введите пароль">
    </div>
    <div class="btn-group">
        <button onclick="registerUser()" class="btn-secondary">Регистрация</button>
        <button onclick="loginUser()" class="btn-primary">Войти</button>
    </div>
    <div id="error-msg" class="error-text" style="color: #f87171; margin-top: 10px; word-break: break-all;"></div>
</div>

<script>
    const SUPABASE_URL = 'https://agwwnngvrtemktkfedwx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_sS_4EgOUfQme_LDMK8WxAQ_v9_O_1L3';
    
    // Проверка загрузки библиотеки
    const errorDiv = document.getElementById('error-msg');
    if (typeof supabase === 'undefined') {
        errorDiv.innerText = 'Ошибка: библиотека Supabase не загрузилась!';
    }

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function registerUser() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        errorDiv.innerText = 'Запрос регистрации...';

        if (!username || !password) {
            errorDiv.innerText = 'Заполните все поля!';
            return;
        }

        try {
            // Проверяем, не занят ли логин
            const { data: existing, error: searchError } = await client.from('users').select('*').eq('username', username).maybeSingle();
            
            if (searchError) {
                errorDiv.innerText = 'Ошибка поиска: ' + searchError.message;
                return;
            }

            if (existing) {
                errorDiv.innerText = 'Такой логин уже занят!';
                return;
            }

            // Регистрируем нового пользователя
            const { error } = await client.from('users').insert([{ username, password }]);
            if (error) {
                errorDiv.innerText = 'Ошибка вставки: ' + error.message;
            } else {
                errorDiv.style.color = '#4ade80';
                errorDiv.innerText = 'Регистрация успешна! Теперь нажмите Войти.';
            }
        } catch (err) {
            errorDiv.innerText = 'Сбой кода: ' + err.message;
        }
    }

    async function loginUser() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        errorDiv.innerText = 'Вход в систему...';

        if (!username || !password) {
            errorDiv.innerText = 'Заполните все поля!';
            return;
        }

        try {
            // Ищем пользователя в базе
            const { data, error } = await client
                .from('users')
                .select('*')
                .eq('username', username)
                .eq('password', password)
                .maybeSingle();

            if (error) {
                errorDiv.innerText = 'Ошибка входа: ' + error.message;
                return;
            }

            if (!data) {
                errorDiv.innerText = 'Неверный логин или пароль!';
            } else {
                localStorage.setItem('current_user', username);
                window.location.href = 'chat.html';
            }
        } catch (err) {
            errorDiv.innerText = 'Сбой кода: ' + err.message;
        }
    }
</script>

</body>
</html>
