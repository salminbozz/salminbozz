<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приватный Чат</title>
    <!-- Подключаем клиент Supabase для работы с базой данных -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #1e1e24;
            color: #e0e0e6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background-color: #2b2b36;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border: 1px solid #3a3a4c;
        }

        .chat-header {
            padding: 16px 20px;
            background-color: #23232d;
            border-bottom: 1px solid #3a3a4c;
            border-radius: 12px 12px 0 0;
        }

        .chat-header h2 {
            font-size: 1.1rem;
            color: #a0a0b2;
            font-weight: 500;
        }

        .messages-list {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-item {
            background-color: #353545;
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
            border-left: 3px solid #6c5ce7;
        }

        .message-author {
            font-size: 0.8rem;
            color: #8a8aa3;
            margin-bottom: 4px;
        }

        .message-text {
            font-size: 0.95rem;
            line-height: 1.4;
            color: #eeeeee;
        }

        .chat-input-area {
            padding: 16px;
            background-color: #23232d;
            border-top: 1px solid #3a3a4c;
            display: flex;
            gap: 10px;
            border-radius: 0 0 12px 12px;
        }

        input[type="text"] {
            background-color: #1e1e24;
            border: 1px solid #3a3a4c;
            border-radius: 6px;
            color: #e0e0e6;
            padding: 10px 14px;
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #6c5ce7;
        }

        #username-input {
            width: 30%;
        }

        #message-input {
            flex: 1;
        }

        button {
            background-color: #4a47a3;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #5b58c6;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h2>Общий чат</h2>
    </div>
    <div class="messages-list" id="messages-list">
        <!-- Сообщения будут появляться здесь -->
    </div>
    <div class="chat-input-area">
        <input type="text" id="username-input" placeholder="Имя" value="Гость">
        <input type="text" id="message-input" placeholder="Введите сообщение...">
        <button onclick="sendMessage()">Отправить</button>
    </div>
</div>

<script>
    // 1. Вставьте сюда данные из вашего проекта Supabase
    const SUPABASE_URL = 'ВАШ_SUPABASE_URL';
    const SUPABASE_KEY = 'ВАШ_SUPABASE_ANON_KEY';
    
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const messagesList = document.getElementById('messages-list');
    const messageInput = document.getElementById('message-input');
    const usernameInput = document.getElementById('username-input');

    // Загрузка старых сообщений при входе
    async function fetchMessages() {
        const { data, error } = await supabase
            .from('messages')
            .select('*')
            .order('created_at', { ascending: true });

        if (error) console.error('Ошибка загрузки:', error);
        else {
            messagesList.innerHTML = '';
            data.forEach(renderMessage);
            scrollToBottom();
        }
    }

    // Отправка нового сообщения
    async function sendMessage() {
        const text = messageInput.value.trim();
        const username = usernameInput.value.trim() || 'Аноним';

        if (!text) return;

        const { error } = await supabase
            .from('messages')
            .insert([{ username: username, text: text }]);

        if (error) console.error('Ошибка отправки:', error);
        else messageInput.value = '';
    }

    // Отображение сообщения в списке
    function renderMessage(msg) {
        const msgElement = document.createElement('div');
        msgElement.className = 'message-item';
        msgElement.innerHTML = `
            <div class="message-author">${escapeHtml(msg.username)}</div>
            <div class="message-text">${escapeHtml(msg.text)}</div>
        `;
        messagesList.appendChild(msgElement);
        scrollToBottom();
    }

    // Подписка на новые сообщения в реальном времени (Realtime)
    supabase
        .channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
            renderMessage(payload.new);
        })
        .subscribe();

    function scrollToBottom() {
        messagesList.scrollTop = messagesList.scrollHeight;
    }

    function escapeHtml(text) {
        return text.replace(/[&<>"']/g, function(m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
        });
    }

    // Разрешаем отправку по клавише Enter
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    fetchMessages();
</script>

</body>
</html>
