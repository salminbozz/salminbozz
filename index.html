<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход / Регистрация</title>
    <!-- Подключаем Supabase и общие стили -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-card">
    <h2>Вход в мессенджер</h2>
    <div class="form-group">
        <input type="text" id="username" placeholder="Придумайте или введите логин">
        <input type="password" id="password" placeholder="Введите пароль">
    </div>
    <div class="btn-group">
        <button onclick="registerUser()" class="btn-secondary">Регистрация</button>
        <button onclick="loginUser()" class="btn-primary">Войти</button>
    </div>
    <div id="error-msg" class="error-text"></div>
</div>

<script>
    const SUPABASE_URL = 'https://agwwnngvrtemktkfedwx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_sS_4EgOUfQme_LDMK8WxAQ_v9_O_1L3';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function registerUser() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorDiv = document.getElementById('error-msg');

        if (!username || !password) {
            errorDiv.innerText = 'Заполните все поля!';
            return;
        }

        // Проверяем, не занят ли логин
        const { data: existing } = await supabase.from('users').select('*').eq('username', username).single();
        if (existing) {
            errorDiv.innerText = 'Такой логин уже занят!';
            return;
        }

        // Регистрируем нового пользователя
        const { error } = await supabase.from('users').insert([{ username, password }]);
        if (error) {
            errorDiv.innerText = 'Ошибка регистрации';
        } else {
            alert('Регистрация успешна! Теперь войдите.');
        }
    }

    async function loginUser() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorDiv = document.getElementById('error-msg');

        // Ищем пользователя в базе
        const { data, error } = await supabase
            .from('users')
            .select('*')
            .eq('username', username)
            .eq('password', password)
            .single();

        if (error || !data) {
            errorDiv.innerText = 'Неверный логин или пароль!';
        } else {
            // Сохраняем имя текущего пользователя в память браузера и перенаправляем в чат
            localStorage.setItem('current_user', username);
            window.location.href = 'chat.html';
        }
    }
</script>

</body>
</html>
